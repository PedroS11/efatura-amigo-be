name: Deploy feature branch

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    env:
      DEPLOY_ENV: ${{ github.head_ref }}
      STACK_NAME: EfaturaAmigoBeStack-${{ github.head_ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::566348719618:role/Github-Actions
          aws-region: eu-west-2

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Project
        run: yarn build

      - name: CDK Bootstrap
        run: |
          npx cdk bootstrap aws://566348719618/eu-west-2 \
            --trust 566348719618 \
            --cloudformation-execution-policies arn:aws:iam::aws:policy/AdministratorAccess \
            --bootstrap-customer-key false

      - name: Deploy CDK Stack
        run: npx cdk deploy EfaturaAmigoBeStack-${DEPLOY_ENV} --require-approval never --outputs-file cdk-outputs.json

      - name: Prepare Worker deploy
        id: worker
        run: |
          slug=$(echo "$DEPLOY_ENV" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-40 | sed 's/-*$//')
          url=$(jq -r 'to_entries[0].value.ApiUrl // empty' cdk-outputs.json)
          [ -n "$url" ] || { echo "ApiUrl not found"; exit 1; }
          echo "name=efatura-amigo-api-$slug" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy branch Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --env preview --name ${{ steps.worker.outputs.name }} --var EFATURA_API_BASE_URL:${{ steps.worker.outputs.url }}

  destroy:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    env:
      DEPLOY_ENV: ${{ github.head_ref }}
      STACK_NAME: EfaturaAmigoBeStack-${{ github.head_ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::566348719618:role/Github-Actions
          aws-region: eu-west-2

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Project
        run: yarn build

      - name: Destroy CDK Stack
        run: npx cdk destroy EfaturaAmigoBeStack-${DEPLOY_ENV} --force

      - name: Worker name
        id: worker
        run: |
          slug=$(echo "$DEPLOY_ENV" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-40 | sed 's/-*$//')
          echo "name=efatura-amigo-api-$slug" >> "$GITHUB_OUTPUT"

          - name: Delete branch Worker
            continue-on-error: true   # don't fail if it was never deployed
            uses: cloudflare/wrangler-action@v3
            with:
              apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              workingDirectory: worker
              command: delete --name ${{ steps.worker.outputs.name }} --force