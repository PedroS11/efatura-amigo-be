# worker/wrangler.toml
name = "efatura-amigo-api"
main = "index.ts"
compatibility_date = "2024-08-20"
workers_dev = false      # only reachable through the binding
preview_urls = false

[vars]
EFATURA_API_BASE_URL = "https://g5o95bvqaj.execute-api.eu-west-2.amazonaws.com"

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 100
  period = 60

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 5
  period = 60